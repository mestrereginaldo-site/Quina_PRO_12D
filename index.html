<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quina PRO - Fechamento 12 Dezenas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.4s ease-out; }
        .toast-exit { transform: translateY(0); opacity: 1; }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s ease-in; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center py-6 px-4 pb-20">

    <div id="toast-container" class="fixed bottom-5 left-0 right-0 flex flex-col items-center gap-2 z-50 pointer-events-none"></div>

    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-800 p-8 text-center text-white relative overflow-hidden">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-3 relative z-10">Quina PRO <span class="text-amber-400">12 Dezenas</span></h1>
            <p class="text-indigo-100 font-medium relative z-10 text-sm md:text-base">Matriz Matemática Intocável (29 Jogos | R$ 87,00).</p>
        </div>

        <div class="p-6 md:p-8">
            <div class="mb-6 text-center bg-indigo-50 rounded-2xl p-4 border border-indigo-100 shadow-sm">
                <p class="text-slate-700 text-sm md:text-base">
                    Insira suas <strong>12 dezenas</strong> estratégicas (1 a 80).
                </p>
            </div>

            <!-- 12 Inputs Grid -->
            <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-12 justify-center gap-2 md:gap-3 mb-8" id="input-container">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n1">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n2">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n3">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n4">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n5">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n6">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n7">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n8">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n9">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n10">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n11">
                <input type="number" min="1" max="80" class="w-full aspect-square text-center text-xl md:text-2xl font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition-all shadow-sm text-indigo-900" id="n12">
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4 mb-10">
                <button onclick="gerarJogos()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-full shadow-lg transform hover:-translate-y-0.5 transition-all w-full sm:w-auto text-lg flex items-center justify-center gap-2">
                    ⚡ Gerar 29 Jogos
                </button>
                <button onclick="limparEntradas()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3.5 px-8 rounded-full transition-all w-full sm:w-auto border border-slate-200 text-lg">
                    Limpar
                </button>
            </div>

            <div id="active-game-section" class="hidden">
                <hr class="border-slate-200 mb-8">
                
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <div class="text-center md:text-left">
                        <h2 class="text-2xl font-bold text-slate-800">Jogos Gerados</h2>
                        <p class="text-sm text-slate-500 font-medium mt-0.5" id="active-base-numbers"></p>
                    </div>
                    <button onclick="salvarJogoNoApp()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 shadow-md transition-all active:scale-95">
                        Salvar no Aplicativo
                    </button>
                </div>

                <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mb-10">
                    <!-- Cards injetados via JS -->
                </div>

                <div class="bg-gradient-to-b from-indigo-50 to-white rounded-3xl p-6 md:p-8 border border-indigo-100 shadow-sm">
                    <h3 class="text-2xl font-bold text-indigo-900 mb-2 text-center">Conferir Resultado Oficial</h3>
                    
                    <div class="flex flex-wrap justify-center gap-3 mb-8" id="draw-container">
                        <input type="number" min="1" max="80" class="w-12 h-12 md:w-14 md:h-14 text-center text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none shadow-sm" id="s1">
                        <input type="number" min="1" max="80" class="w-12 h-12 md:w-14 md:h-14 text-center text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none shadow-sm" id="s2">
                        <input type="number" min="1" max="80" class="w-12 h-12 md:w-14 md:h-14 text-center text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none shadow-sm" id="s3">
                        <input type="number" min="1" max="80" class="w-12 h-12 md:w-14 md:h-14 text-center text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none shadow-sm" id="s4">
                        <input type="number" min="1" max="80" class="w-12 h-12 md:w-14 md:h-14 text-center text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none shadow-sm" id="s5">
                    </div>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="simularSorteioRandomico()" class="bg-white border-2 border-indigo-200 text-indigo-700 font-bold py-3 px-6 rounded-xl hover:bg-indigo-50 transition-all flex items-center justify-center gap-2 shadow-sm">
                            🎲 Simular Sorteio
                        </button>
                        <button onclick="conferirJogos()" class="bg-indigo-600 text-white font-bold py-3 px-10 rounded-xl hover:bg-indigo-700 shadow-md transition-all flex items-center justify-center gap-2 active:scale-95">
                            Conferir Meus Jogos
                        </button>
                    </div>

                    <div id="check-summary" class="mt-8 p-6 bg-white border-2 border-indigo-200 rounded-2xl text-center hidden shadow-sm">
                        <!-- Resultados injetados via JS -->
                    </div>
                </div>
            </div>
            
            <div class="mt-12 bg-slate-50 rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-slate-800">Meus Jogos Salvos (12 Dezenas)</h3>
                    </div>
                </div>
                
                <div id="saved-games-list" class="space-y-3">
                    <p class="text-center text-slate-400 py-4 italic" id="empty-saves-msg">Nenhum jogo salvo ainda.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        let jogosAtivos = [];
        let dezenasBaseAtivas = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderizarListaSalvos();
        });

        function mostrarToast(mensagem, tipo = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const cores = { 'error': 'bg-red-600 text-white', 'success': 'bg-emerald-600 text-white', 'info': 'bg-indigo-600 text-white' };
            
            toast.className = `px-6 py-3 rounded-full font-bold shadow-xl pointer-events-auto toast-enter ${cores[tipo]} flex items-center gap-2 text-sm`;
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('toast-enter'); toast.classList.add('toast-enter-active'); }, 10);
            setTimeout(() => { toast.classList.remove('toast-enter-active'); toast.classList.add('toast-exit-active'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function limparEntradas() {
            for(let i=1; i<=12; i++) document.getElementById(`n${i}`).value = '';
            document.getElementById('active-game-section').classList.add('hidden');
            jogosAtivos = [];
            dezenasBaseAtivas = [];
        }

        function gerarJogos() {
            const dezenas = [];
            for(let i=1; i<=12; i++) {
                let val = document.getElementById(`n${i}`).value;
                if(!val) return mostrarToast("Preencha todas as 12 dezenas!", "error");
                let num = parseInt(val);
                if(num < 1 || num > 80) return mostrarToast("As dezenas devem estar entre 1 e 80.", "error");
                dezenas.push(num);
            }
            
            if(new Set(dezenas).size !== 12) {
                return mostrarToast("Não repita números! Escolha 12 dezenas diferentes.", "error");
            }
            
            dezenas.sort((a,b) => a-b);
            dezenasBaseAtivas = dezenas;
            
            // Matriz absoluta e intocável para 12 dezenas em 29 jogos
            const matrizIndices = [
                [0, 1, 2, 3, 4], [0, 1, 5, 6, 7], [0, 2, 8, 9, 10], [0, 3, 5, 8, 11],
                [0, 4, 6, 9, 11], [0, 4, 7, 8, 10], [1, 2, 5, 9, 11], [1, 3, 6, 8, 10],
                [1, 4, 7, 9, 10], [1, 4, 8, 10, 11], [2, 3, 7, 8, 11], [2, 4, 5, 6, 10],
                [2, 4, 6, 7, 9], [3, 4, 5, 7, 10], [3, 4, 5, 9, 11], [5, 6, 7, 8, 9],
                [0, 1, 3, 9, 10], [0, 2, 6, 7, 11], [0, 5, 7, 9, 10], [1, 2, 4, 7, 8],
                [1, 3, 5, 7, 11], [1, 6, 8, 9, 11], [2, 3, 4, 8, 9], [2, 5, 8, 10, 11],
                [3, 6, 7, 9, 10], [4, 5, 8, 9, 11], [0, 2, 4, 5, 10], [1, 2, 3, 6, 10],
                [0, 1, 4, 6, 11]
            ];

            jogosAtivos = matrizIndices.map(linha => linha.map(idx => dezenas[idx]).sort((a,b)=>a-b));
            
            const custoTotal = (jogosAtivos.length * 3.00).toFixed(2).replace('.', ',');
            document.getElementById('active-base-numbers').innerHTML = `Base: <strong>${dezenas.join(', ')}</strong> • <span class="text-indigo-600">${jogosAtivos.length} Jogos • Custo: R$ ${custoTotal}</span>`;
            
            renderizarJogosNaTela(jogosAtivos);
            
            for(let i=1; i<=5; i++) document.getElementById(`s${i}`).value = '';
            document.getElementById('check-summary').classList.add('hidden');
            
            document.getElementById('active-game-section').classList.remove('hidden');
            document.getElementById('active-game-section').scrollIntoView({behavior: 'smooth', block: 'start'});
            mostrarToast(`Matriz gerada com sucesso! (${jogosAtivos.length} jogos)`, "success");
        }

        function renderizarJogosNaTela(jogos, dezenasSorteadas = []) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            
            jogos.forEach((jogo, index) => {
                let acertos = jogo.filter(n => dezenasSorteadas.includes(n)).length;
                let bgCardClass = 'bg-white border-slate-200';
                let headerClass = 'text-slate-500';
                
                if (acertos === 5) { bgCardClass = 'bg-amber-100 border-amber-500 ring-2 ring-amber-400'; headerClass = 'text-amber-800 font-bold'; }
                else if (acertos === 4) { bgCardClass = 'bg-blue-50 border-blue-400'; headerClass = 'text-blue-700 font-bold'; }
                else if (acertos === 3) { bgCardClass = 'bg-emerald-50 border-emerald-300'; headerClass = 'text-emerald-700 font-bold'; }
                else if (acertos === 2) { bgCardClass = 'bg-slate-100 border-slate-300'; }

                let bolasHtml = jogo.map(n => {
                    let isHit = dezenasSorteadas.includes(n);
                    let baseBolaClass = "w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center text-xs md:text-sm font-bold border-2 transition-all";
                    let corBolaClass = isHit 
                        ? (acertos >= 4 ? "bg-amber-400 border-amber-500 text-slate-900 scale-110 shadow-md" : "bg-indigo-600 border-indigo-700 text-white shadow-md") 
                        : "bg-white border-slate-200 text-slate-600";
                        
                    return `<span class="${baseBolaClass} ${corBolaClass}">${n.toString().padStart(2, '0')}</span>`;
                }).join('');

                grid.innerHTML += `
                    <div class="rounded-xl border ${bgCardClass} p-3 shadow-sm transition-all flex flex-col justify-between h-full">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs uppercase tracking-wider font-semibold ${headerClass}">Jogo ${index + 1}</span>
                            ${acertos > 0 ? `<span class="text-xs font-bold px-2 py-0.5 rounded bg-white bg-opacity-70">${acertos} acertos</span>` : ''}
                        </div>
                        <div class="flex justify-between gap-1">${bolasHtml}</div>
                    </div>
                `;
            });
        }

        function simularSorteioRandomico() {
            if (jogosAtivos.length === 0) return mostrarToast("Gere os jogos primeiro.", "error");
            let sorteio = [];
            let dezenasBaseCopia = [...dezenasBaseAtivas].sort(() => 0.5 - Math.random());
            let rand = Math.random();
            let qtdAcertosNaBase = 3; 
            if(rand > 0.4) qtdAcertosNaBase = 4;
            if(rand > 0.75) qtdAcertosNaBase = 5;

            sorteio = dezenasBaseCopia.slice(0, qtdAcertosNaBase);
            while(sorteio.length < 5) {
                let n = Math.floor(Math.random() * 80) + 1;
                if(!sorteio.includes(n) && !dezenasBaseAtivas.includes(n)) sorteio.push(n);
            }
            sorteio.sort(() => 0.5 - Math.random());
            sorteio.forEach((n, i) => document.getElementById(`s${i+1}`).value = n);
            conferirJogos();
        }

        function conferirJogos() {
            if (jogosAtivos.length === 0) return mostrarToast("Não há jogos ativos para conferir.", "error");
            let sorteio = [];
            for(let i=1; i<=5; i++) {
                let val = document.getElementById(`s${i}`).value;
                if(!val) return mostrarToast("Digite as 5 dezenas do sorteio.", "error");
                sorteio.push(parseInt(val));
            }
            if(new Set(sorteio).size !== 5) return mostrarToast("O resultado tem números repetidos.", "error");

            renderizarJogosNaTela(jogosAtivos, sorteio);
            let quinas = 0, quadras = 0, ternos = 0, duques = 0;
            jogosAtivos.forEach(jogo => {
                let acertos = jogo.filter(n => sorteio.includes(n)).length;
                if(acertos === 5) quinas++;
                if(acertos === 4) quadras++;
                if(acertos === 3) ternos++;
                if(acertos === 2) duques++;
            });

            const summary = document.getElementById('check-summary');
            summary.classList.remove('hidden');
            let acertosNoGrupo = dezenasBaseAtivas.filter(n => sorteio.includes(n)).length;

            summary.innerHTML = `
                <div class="mb-4 inline-block bg-indigo-50 border border-indigo-100 text-indigo-700 px-4 py-2 rounded-xl text-sm font-medium">
                    As dezenas sorteadas acertaram <strong>${acertosNoGrupo}</strong> números dentro da sua base de 12.
                </div>
                <h4 class="text-xl font-bold text-slate-800 mb-4">Resumo da Premiação:</h4>
                <div class="flex flex-wrap justify-center gap-3">
                    ${quinas > 0 ? `<div class="px-4 py-2 bg-amber-500 text-white rounded-xl font-bold shadow-md animate-bounce">${quinas}x QUINA 🏆</div>` : ''}
                    ${quadras > 0 ? `<div class="px-4 py-2 bg-blue-500 text-white rounded-xl font-bold shadow-md">${quadras}x Quadra</div>` : ''}
                    ${ternos > 0 ? `<div class="px-4 py-2 bg-emerald-500 text-white rounded-xl font-bold shadow-md">${ternos}x Terno</div>` : ''}
                    ${duques > 0 ? `<div class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-bold border border-slate-300">${duques}x Duque</div>` : ''}
                    ${(quinas+quadras+ternos+duques) === 0 ? `<div class="text-slate-500 font-medium">Nenhum bilhete premiado nesta faixa.</div>` : ''}
                </div>
            `;
            summary.scrollIntoView({behavior: 'smooth', block: 'end'});
        }

        function salvarJogoNoApp() {
            if(jogosAtivos.length === 0) return;
            try {
                let saved = JSON.parse(localStorage.getItem('quinaPro12_saves')) || [];
                saved.unshift({
                    id: Date.now(),
                    data: new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                    base: dezenasBaseAtivas,
                    jogos: jogosAtivos
                });
                localStorage.setItem('quinaPro12_saves', JSON.stringify(saved));
                mostrarToast("Fechamento de 12 dezenas salvo com sucesso!", "success");
                renderizarListaSalvos();
            } catch (e) { mostrarToast("Erro ao salvar no navegador.", "error"); }
        }

        function carregarJogoSalvo(id) {
            try {
                let saved = JSON.parse(localStorage.getItem('quinaPro12_saves')) || [];
                let aposta = saved.find(s => s.id === id);
                if(aposta) {
                    limparEntradas();
                    aposta.base.forEach((n, i) => document.getElementById(`n${i+1}`).value = n);
                    dezenasBaseAtivas = aposta.base;
                    jogosAtivos = aposta.jogos;
                    
                    const custoTotal = (jogosAtivos.length * 3.00).toFixed(2).replace('.', ',');
                    document.getElementById('active-base-numbers').innerHTML = `Base: <strong>${aposta.base.join(', ')}</strong> • <span class="text-indigo-600">${jogosAtivos.length} Jogos • Custo: R$ ${custoTotal}</span>`;
                    
                    renderizarJogosNaTela(jogosAtivos);
                    document.getElementById('active-game-section').classList.remove('hidden');
                    document.getElementById('active-game-section').scrollIntoView({behavior: 'smooth', block: 'start'});
                    
                    for(let i=1; i<=5; i++) document.getElementById(`s${i}`).value = '';
                    document.getElementById('check-summary').classList.add('hidden');
                    mostrarToast("Aposta carregada com sucesso!", "info");
                }
            } catch(e) {}
        }

        function deletarJogoSalvo(id, event) {
            event.stopPropagation();
            if(!confirm("Deseja realmente excluir este fechamento salvo?")) return;
            try {
                let saved = JSON.parse(localStorage.getItem('quinaPro12_saves')) || [];
                saved = saved.filter(s => s.id !== id);
                localStorage.setItem('quinaPro12_saves', JSON.stringify(saved));
                renderizarListaSalvos();
                mostrarToast("Aposta removida da memória.", "info");
            } catch(e) {}
        }

        function renderizarListaSalvos() {
            const container = document.getElementById('saved-games-list');
            const emptyMsg = document.getElementById('empty-saves-msg');
            try {
                let saved = JSON.parse(localStorage.getItem('quinaPro12_saves')) || [];
                if(saved.length === 0) {
                    container.innerHTML = ''; container.appendChild(emptyMsg); emptyMsg.style.display = 'block'; return;
                }
                emptyMsg.style.display = 'none'; container.innerHTML = '';
                
                saved.forEach(aposta => {
                    container.innerHTML += `
                        <div onclick="carregarJogoSalvo(${aposta.id})" class="bg-white border border-slate-200 hover:border-indigo-400 p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center cursor-pointer transition-all hover:shadow-md gap-4">
                            <div>
                                <div class="text-xs text-slate-400 mb-1 font-medium">Salvo em: ${aposta.data}</div>
                                <div class="font-bold text-indigo-900 break-all text-base tracking-wide">${aposta.base.join(' - ')}</div>
                                <div class="text-sm text-slate-500 mt-1">${aposta.jogos.length} Jogos gerados</div>
                            </div>
                            <div class="flex gap-2 w-full md:w-auto">
                                <button class="flex-1 md:flex-none bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-2 rounded-xl font-bold text-sm transition-colors border border-indigo-100">Carregar</button>
                                <button onclick="deletarJogoSalvo(${aposta.id}, event)" class="bg-red-50 text-red-600 hover:bg-red-100 p-2.5 rounded-xl transition-colors border border-red-100" title="Apagar">
